<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SodaHealth Quest: The Fitness Evolution</title>
    <link rel="stylesheet" href="SodaGame.css">
</head>

<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-overlay">
            <div id="hud">
                <div class="stat-box">
                    <span class="label">Fitness Level:</span>
                    <span id="fitness-stat">Average</span>
                </div>
                <div class="stat-box">
                    <span class="label">Distance:</span>
                    <span id="score-val">0</span>m
                </div>
                <div class="stat-box">
                    <span class="label">Power:</span>
                    <div id="power-bar-container">
                        <div id="power-bar"></div>
                    </div>
                </div>
            </div>

            <div id="quiz-container" class="hidden">
                <div class="glass-card">
                    <h2 id="question-text">Question goes here?</h2>
                    <div id="options-container">
                        <!-- Options will be injected here -->
                    </div>
                </div>
            </div>

            <div id="game-over" class="hidden">
                <div class="glass-card">
                    <h1>SODA OVERLOAD!</h1>
                    <p>The microbes have overwhelmed you. Try to make healthier choices next time!</p>
                    <button onclick="location.reload()">Reset Odyssey</button>
                    <a href="sodahealth2.html" class="back-link">Return to Article</a>
                </div>
            </div>

            <div id="victory" class="hidden">
                <div class="glass-card">
                    <h1>PEAK FITNESS ACHIEVED!</h1>
                    <p>You've mastered the science of Allulose, Blueberries, and the Soleus muscle.</p>
                    <button onclick="location.reload()">Run it Again</button>
                    <a href="sodahealth2.html" class="back-link">Read More Tips</a>
                </div>
            </div>
        </div>
    </div>

    <script src="SodaGame.js"></script>
</body>

</html>
